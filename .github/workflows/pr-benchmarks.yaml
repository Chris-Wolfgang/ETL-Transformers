name: PR Benchmarks

# Forward-looking perf gate: runs BenchmarkDotNet on the PR head AND on the PR's
# base commit, computes the per-benchmark time/allocation delta, and posts (or
# replaces) a sticky comment with the delta table. Fails the PR when a benchmark
# regresses past the threshold unless the PR carries the `perf-impact-acknowledged`
# label.
#
# Split into two jobs on a privilege boundary: `benchmark` runs the PR-controlled
# benchmark code with a READ-ONLY token, and `report` holds the pull-requests: write
# token but runs no PR code — it only consumes the delta artifact and calls the API.
# So a malicious PR can at most skew its own perf numbers; it can never reach the
# write token, and the gate verdict is computed with the base branch's comparator.
#
# Complements benchmarks.yaml (which graphs the post-merge trend on main); this one
# catches a regression before it merges.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'

permissions:
  contents: read  # Checkout the PR head and base for the delta comparison

concurrency:
  # One run per PR; a new push cancels the in-flight comparison so the sticky
  # comment always reflects the latest head.
  group: pr-benchmarks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BENCH_PROJECT: benchmarks/Wolfgang.Etl.Transformers.Benchmarks/Wolfgang.Etl.Transformers.Benchmarks.csproj
  BENCH_DIR: benchmarks/Wolfgang.Etl.Transformers.Benchmarks
  TIME_THRESHOLD: '20'
  ALLOC_THRESHOLD: '50'
  ACK_LABEL: perf-impact-acknowledged

jobs:
  # Runs PR-controlled benchmark code with a read-only token and no comment/label
  # ability. The delta is computed with the BASE branch's trusted copy of
  # compare-benchmarks.py, so a PR cannot doctor the comparator to force regressed=false.
  benchmark:
    name: Compare BDN delta vs base
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
      regressed: ${{ steps.delta.outputs.regressed }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the base commit can be checked out into a worktree.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check benchmark project exists on both sides
        id: guard
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          head_ok=false
          base_ok=false
          [ -f "$BENCH_PROJECT" ] && head_ok=true
          if git cat-file -e "${BASE_SHA}:${BENCH_PROJECT}" 2>/dev/null; then
            base_ok=true
          fi
          echo "head_ok=$head_ok" >> "$GITHUB_OUTPUT"
          echo "base_ok=$base_ok" >> "$GITHUB_OUTPUT"
          if [ "$head_ok" = true ] && [ "$base_ok" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Benchmark project missing on head ($head_ok) or base ($base_ok); skipping perf gate."
          fi

      - name: Run benchmarks on PR head
        if: steps.guard.outputs.run == 'true'
        working-directory: ${{ env.BENCH_DIR }}
        # ShortRun keeps wall-clock reasonable; --memory adds the allocation column.
        run: dotnet run -c Release -- --filter "*" --job short --memory --exporters json

      - name: Stash head results
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/head-results"
          cp -r "$BENCH_DIR/BenchmarkDotNet.Artifacts/results/." "$RUNNER_TEMP/head-results/"

      - name: Run benchmarks on base
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Build the base commit in an isolated worktree so head build outputs and
          # BDN artifacts don't clash.
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          ( cd "$RUNNER_TEMP/base/$BENCH_DIR" \
            && dotnet run -c Release -- --filter "*" --job short --memory --exporters json )
          mkdir -p "$RUNNER_TEMP/base-results"
          cp -r "$RUNNER_TEMP/base/$BENCH_DIR/BenchmarkDotNet.Artifacts/results/." "$RUNNER_TEMP/base-results/"

      - name: Compute delta
        id: delta
        if: steps.guard.outputs.run == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Prefer the BASE branch's comparator so a PR can't alter the script to always
          # report regressed=false. Fall back to the in-tree copy when the base doesn't
          # have it yet — e.g. the PR that first adds or moves the script — since those
          # changes are exactly what review covers, and this job holds only a read-only
          # token either way (the write token lives in the separate `report` job).
          if git cat-file -e "${BASE_SHA}:scripts/compare-benchmarks.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/compare-benchmarks.py" > "$RUNNER_TEMP/compare-trusted.py"
            comparator="$RUNNER_TEMP/compare-trusted.py"
            echo "Using base-branch comparator (${BASE_SHA})."
          else
            comparator="scripts/compare-benchmarks.py"
            echo "::notice::compare-benchmarks.py absent on base; using the PR's copy (this job is read-only)."
          fi
          python3 "$comparator" \
            --base-dir "$RUNNER_TEMP/base-results" \
            --head-dir "$RUNNER_TEMP/head-results" \
            --time-threshold "$TIME_THRESHOLD" \
            --alloc-threshold "$ALLOC_THRESHOLD" \
            --out "$RUNNER_TEMP/comment.md" | tee -a "$GITHUB_OUTPUT"

      - name: Upload delta comment
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-benchmark-comment
          path: ${{ runner.temp }}/comment.md
          if-no-files-found: error

  # Holds the pull-requests: write token but runs NO PR-controlled code — it only
  # consumes the artifact from `benchmark` and calls the GitHub API. This is the
  # privilege boundary the split exists to create.
  report:
    name: Publish delta + enforce gate
    needs: benchmark
    if: needs.benchmark.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read         # No checkout needed, but keep the default read scope explicit
      pull-requests: write   # Post/replace the sticky delta comment on the PR
    steps:
      - name: Download delta comment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-benchmark-comment
          path: comment

      - name: Post or update sticky comment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- pr-benchmarks -->'
          { printf '%s\n\n' "$marker"; cat comment/comment.md; } > body.md
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\")) | .id] | first // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md >/dev/null
            echo "Updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null
            echo "Created new comment"
          fi

      - name: Enforce threshold
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REGRESSED: ${{ needs.benchmark.outputs.regressed }}
        run: |
          set -euo pipefail
          if [ "$REGRESSED" != "true" ]; then
            echo "✅ No benchmark regression beyond threshold."
            exit 0
          fi
          acknowledged=$(gh api "repos/$REPO/issues/$PR/labels" \
            --jq "any(.[]; .name == \"$ACK_LABEL\")")
          if [ "$acknowledged" = "true" ]; then
            echo "::warning::Perf regression detected but acknowledged via '$ACK_LABEL' label."
            exit 0
          fi
          echo "::error::Benchmark regression exceeds the threshold (time > ${TIME_THRESHOLD}% or alloc > ${ALLOC_THRESHOLD}%). Review the delta comment, or add the '$ACK_LABEL' label if the change is intentional."
          exit 1
