name: Coverage Report

# Publishes an HTML coverage report to gh-pages/coverage/ after every
# push to main and on each GitHub Release. Coverage data is generated
# by Coverlet's cobertura format and rendered by ReportGenerator.
#
# Published URL:
#   https://chris-wolfgang.github.io/<repo>/coverage/latest/
#   https://chris-wolfgang.github.io/<repo>/coverage/<tag>/   (on release)

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build coverage for'
        required: false
        default: 'main'

# No workflow-level write: Scorecard's Token-Permissions check scores a top-level
# write as 0 and then reports every job-level write in the repository as well. The
# one job that publishes to gh-pages declares it for itself below.
permissions:
  contents: read

concurrency:
  # Join the repo-wide gh-pages lock (see benchmarks.yaml) so all gh-pages
  # publishes serialize; never cancel an in-flight coverage upload.
  group: gh-pages
  cancel-in-progress: false

jobs:
  coverage-report:
    name: Generate & Publish Coverage Report
    runs-on: ubuntu-latest
    if: github.repository != 'Chris-Wolfgang/repo-template'
    permissions:
      contents: write   # required to push the report to gh-pages
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Run tests with coverage
        # Per project rather than solution-wide, because this pass is pinned to net10.0 and not
        # every test project targets it: Tests.Concurrency is deliberately net8.0, since the
        # Coyote rewriter and model checker run on the .NET 8 runtime. A solution-wide
        # `dotnet test --framework net10.0` fails on that project with NETSDK1005 before any
        # test runs, which is what broke this workflow. The skip is computed from each project's
        # own TargetFramework(s) rather than hard-coding a name, so a project added later without
        # net10.0 is skipped with a notice instead of failing the run. Coyote has its own weekly
        # workflow and contributes no coverage here.
        run: |
          set -euo pipefail
          ran=0
          for proj in tests/*/*.csproj; do
            if ! grep -qE '<TargetFrameworks?>[^<]*net10[.]0' "$proj"; then
              echo "::notice::Skipping $proj - it does not target net10.0"
              continue
            fi
            dotnet test "$proj" \
              --configuration Release \
              --framework net10.0 \
              --collect:"XPlat Code Coverage" \
              --results-directory ./coverage-results \
              -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::No test project targeting net10.0 was found; coverage would be empty."
            exit 1
          fi
          echo "Ran coverage over $ran test project(s)."
        shell: bash

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML report
        run: |
          reportgenerator \
            -reports:"./coverage-results/**/coverage.cobertura.xml" \
            -targetdir:"./coverage-html" \
            -reporttypes:"Html;Badges" \
            -title:"Wolfgang.Etl.Transformers Coverage"
        shell: bash

      - name: Determine version label
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "label=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "label=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: gh-pages
          persist-credentials: true

      - name: Publish report to gh-pages
        shell: bash
        env:
          VERSION_LABEL: ${{ steps.version.outputs.label }}
        run: |
          set -e
          dest="gh-pages/coverage/${VERSION_LABEL}"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -r coverage-html/. "$dest/"

          # Always update coverage/latest/ to point to this build
          rm -rf gh-pages/coverage/latest
          mkdir -p gh-pages/coverage/latest
          cp -r coverage-html/. gh-pages/coverage/latest/

          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage/
          git diff --cached --quiet || git commit -m "coverage: publish report for ${VERSION_LABEL}"
          git push
